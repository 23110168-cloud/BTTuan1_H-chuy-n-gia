<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiệp Mời Sinh Nhật</title>

    <!-- CSS -->
    <link rel="stylesheet" href="canvas.css" />
    <link rel="stylesheet" href="present.css" />
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="index.css" />

    <!-- jQuery -->
    <script src="jquery.js"></script>
  </head>
  <body>
    <div class="parent">
      <!-- Hiệu ứng canvas -->
      <canvas id="canvas"></canvas>

      <!-- Hộp quà -->
      <section class="above-fold">
        <div class="wrap-present">
          <div class="present-box" id="present">
            <!-- Bên trong hộp quà -->
            <div class="present">
              <div class="img-wrap" id="present-image"></div>
            </div>
            <!-- Các mặt hộp -->
            <div class="side front"></div>
            <div class="side back"></div>
            <div class="side left"></div>
            <div class="side right"></div>
            <div class="side top">
              <span class="to">
                <span class="name" id="nametag"></span>
              </span>
            </div>
            <div class="side bottom"></div>
          </div>
        </div>
        <p class="info-text">Click để mở quà</p>
      </section>

      <!-- Thiệp mời sau khi mở hộp -->
      <div id="card">
        <video class="honey" controls autoplay muted playsinline>
          <source src="birthday-card.mp4" type="video/mp4" />
        </video>

        <h4 class="title-card">💌 Thiệp mời sinh nhật 💌</h4>
        <h4 class="content-card"></h4>
      </div>
    </div>

    <!-- Nhạc nền -->
    <audio autoplay loop id="playAudio">
      <source src="nhacnen.mp3" type="audio/mpeg" />
    </audio>

    <!-- Script -->
    <script src="config.js"></script>
    <script src="canvas.js"></script>
    <script src="present.js"></script>
  </body>
</html>
